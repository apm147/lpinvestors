name: Keep Neon + Render warm

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/health
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "Repo variable APP_URL is not set -- skipping." >&2
            exit 1
          fi
          curl -fsS "${{ vars.APP_URL }}/api/health"
